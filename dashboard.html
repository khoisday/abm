<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lưới phòng – ABM</title>
<meta name="description" content="Virtual Hotel Monitoring – mô phỏng tác tử khách sạn 533 phòng, khách sạn ven bờ, cáp treo, tàu và công viên giải trí: phòng, hành trình khách, điện năng, hàng chờ và so sánh kịch bản.">
<meta name="theme-color" content="#F4F0DB">
<meta property="og:type" content="website">
<meta property="og:title" content="Virtual Hotel Monitoring">
<meta property="og:description" content="Mô phỏng tác tử khách sạn 533 phòng + công viên: hành vi khách, hàng chờ, điện năng và phát thải. Bản đồ 3D và dashboard tương tác.">
<meta property="og:image" content="https://abm.icclab.site/og-image.jpg?v=677c1257">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='0.5' y='0.5' width='29' height='29' fill='%23F4F0DB' stroke='%232E3A26'/%3E%3Cpath d='M0.5 10.5h29M10.5 0.5v29' stroke='%232E3A26' stroke-opacity='0.35'/%3E%3Crect x='15' y='15' width='10' height='10' fill='%23F15534'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // shared with the 3D map: same stored theme key
  try { const t = localStorage.getItem('vhm-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
body{margin:0;background:#F4F0DB}
:root[data-theme="dark"] body{background:#12160F}
a{color:inherit}
button,input,select{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #F15534;outline-offset:2px}
@keyframes vhm-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width: 760px){
.vhm-head{padding:8px 16px!important;gap:4px 12px!important}
.vhm-nav{order:3;flex:1 1 100%;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;gap:0 18px!important}
.vhm-nav::-webkit-scrollbar{display:none}
.vhm-nav a{flex:none;white-space:nowrap}
main{padding-left:10px!important;padding-right:10px!important}
.vhm-head button[aria-haspopup] > span:first-child{display:none}
.lang-switch button{min-width:30px;padding:0 4px}
main section,main aside,main aside section{padding-left:14px!important;padding-right:14px!important}
}
/* wide screens: one header row; the section links scroll sideways before anything wraps (long EN/RU labels) */
@media (min-width: 1001px){
.vhm-head{flex-wrap:nowrap!important}
.vhm-nav{flex:0 1 auto;min-width:0;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
.vhm-nav::-webkit-scrollbar{display:none}
.vhm-nav a{flex:none;white-space:nowrap}
.vhm-head>div:last-child{flex:none;flex-wrap:nowrap!important}
}
@media (min-width: 1001px) and (max-width: 1500px){.vhm-nav a>span:first-child,.vhm-head button[aria-haspopup]>span:first-child{display:none}}
/* scenario menu opened from the header button (shared by all pages) */
.scen-menu{position:absolute;z-index:40;min-width:270px;padding:6px;border-radius:10px;background:#FBF8EB;border:1px solid #D6CEAE;box-shadow:0 12px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;font-family:'Inter Tight',system-ui,sans-serif}
.scen-menu[hidden]{display:none}
.scen-menu a{min-height:40px;display:flex;align-items:center;padding:0 10px;border-radius:6px;text-decoration:none;color:#2E3A26;font-size:13.5px}
.scen-menu a:hover,.scen-menu a[aria-current="true"]{background:#E9E3CA}
.scen-menu a[aria-current="true"]{font-weight:600}
.lang-switch{--lang-on:#F4F0DB;--lang-ink:#2E3A26;border-color:#D6CEAE!important}.lang-switch button+button{border-left-color:#D6CEAE!important}
:root[data-theme="dark"] .lang-switch{--lang-on:#12160F;--lang-ink:#F4F0DB;border-color:#343D2C!important}:root[data-theme="dark"] .lang-switch button+button{border-left-color:#343D2C!important}
:root[data-theme="dark"] .scen-menu{background:#1D2318;border-color:#343D2C}
:root[data-theme="dark"] .scen-menu a{color:#F4F0DB}
:root[data-theme="dark"] .scen-menu a:hover,:root[data-theme="dark"] .scen-menu a[aria-current="true"]{background:#2A3223}
</style>
</head>
<body>
<div id="app"></div>
<div id="scenMenu" class="scen-menu" hidden></div>
<script type="text/plain" id="tpl-rooms">
<div style="min-height: 100vh; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; transition: background 0.4s ease, color 0.4s ease">

<header class="vhm-head" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 12px 24px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="0.5" y="0.5" width="29" height="29" fill="none" stroke="{{c.ink}}"></rect><path d="M0.5 10.5h29M10.5 0.5v29" stroke="{{c.ink}}" stroke-opacity="0.35"></path><rect x="15" y="15" width="10" height="10" fill="{{accent}}"></rect></svg>
<span style="font-size: 17px; font-weight: 700; letter-spacing: 0.02em">ABM</span>
</div>
<nav class="vhm-nav" aria-label="Phân hệ" style="display: flex; flex-wrap: wrap; gap: 2px 18px">
<a href="{{nav.map}}" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.muted}}; font-weight: 500; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px">01</span>Bản đồ 3D</a>
<a href="#rooms" aria-current="page" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.ink}}; font-weight: 600; text-decoration: none; box-shadow: inset 0 -2px 0 {{c.ink}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{c.accentText}}">02</span>Lưới phòng</a>
<a href="#groups" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.muted}}; font-weight: 500; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px">03</span>Nhóm khách</a>
<a href="#energy" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.muted}}; font-weight: 500; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px">04</span>Điện &amp; phát thải</a>
<a href="#queues" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.muted}}; font-weight: 500; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px">05</span>Hàng chờ</a>
<a href="#compare" style="display: inline-flex; gap: 6px; min-height: 44px; align-items: center; color: {{c.muted}}; font-weight: 500; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px">06</span>So sánh kịch bản</a>

</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.ink}}; font-size: 13.5px; cursor: pointer" aria-haspopup="true" aria-expanded="false" onClick="{{openScen}}"><span style="color: {{c.muted}}">Kịch bản</span><span style="font-weight: 600">{{scenName}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<span data-lang-slot></span>
<button type="button" aria-label="Chế độ tối" aria-pressed="{{darkPressed}}" onClick="{{toggleTheme}}" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.ink}}; cursor: pointer">
<template data-if="dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></template>
<template data-if="light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></template>
</button>
</div>
</header>

<main style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 12px 8px 4px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: {{c.muted}}">{{eyebrow}}</span>
<h1 style="margin: 0; font-size: clamp(36px, 5vw, 56px); font-weight: 600; line-height: 0.98; letter-spacing: -0.045em">Lưới 533 phòng<span style="color: {{accent}}">.</span></h1>
<p style="margin: 0; max-width: 620px; font-size: 15px; color: {{c.muted}}">Mỗi ô là một phòng, xếp theo tầng 3 đến 20 như mặt đứng tòa nhà. Kéo thời điểm để xem khách thức dậy, ra ngoài, về phòng và điều hòa bật tắt theo.</p>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.accentText}}; border: 1px solid {{c.accentText}}; border-radius: 3px; padding: 2px 6px">{{dataTag}}</span>
</div>

<div role="group" aria-label="Bộ lọc" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 12px 18px; border-radius: 10px; background: {{c.panel}}; border: 1px solid {{c.line}}">
<div style="display: flex; align-items: center; gap: 10px; flex: 1 1 420px; min-width: 0">
<button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 7px; background: {{c.primaryBg}}; color: {{c.primaryFg}}; cursor: pointer">
<template data-if="playing"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></template>
<template data-if="paused"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></template>
</button>
<div style="display: flex; flex-direction: column; min-width: 86px">
<label for="rg-time" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Thời điểm</label>
<span style="font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{clock}}</span>
</div>
<input id="rg-time" type="range" min="0" max="1435" step="5" value="{{t}}" onChange="{{onTime}}" style="flex: 1; min-width: 0; height: 44px; margin: 0; accent-color: {{accent}}; cursor: pointer">
</div>
<div role="group" aria-label="Tô màu theo" style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Tô màu</span>
<div style="display: flex; border: 1px solid {{c.ink}}; border-radius: 7px; overflow: hidden">
<button type="button" aria-pressed="{{vStatusP}}" onClick="{{setStatus}}" style="min-height: 40px; padding: 0 12px; border: 0; background: {{vStatusBg}}; color: {{vStatusFg}}; font-size: 12.5px; font-weight: 600; cursor: pointer">Trạng thái</button>
<button type="button" aria-pressed="{{vTempP}}" onClick="{{setTemp}}" style="min-height: 40px; padding: 0 12px; border: 0; border-left: 1px solid {{c.ink}}; background: {{vTempBg}}; color: {{vTempFg}}; font-size: 12.5px; font-weight: 600; cursor: pointer">Nhiệt độ</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<label for="rg-filter" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Trạng thái</label>
<select id="rg-filter" value="{{filter}}" onChange="{{onFilter}}" style="min-height: 40px; padding: 0 10px; border: 1px solid {{c.ink}}; border-radius: 7px; background: {{c.panel}}; color: {{c.ink}}; font-size: 13px; cursor: pointer">
<option value="all">Tất cả</option>
<option value="awake">Có khách, thức</option>
<option value="sleep">Có khách, ngủ</option>
<option value="hot">Có khách, quá nóng</option>
<option value="acon">Vắng, điều hòa chạy</option>
<option value="acoff">Vắng, điều hòa tắt</option>
<option value="clean">Đang dọn</option>
<option value="vacant">Phòng trống</option>
</select>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 0; border-radius: 10px; background: {{c.panel}}; border: 1px solid {{c.line}}; overflow: hidden">
<template data-for="kpis" data-as="k">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 14px 18px; border-right: 1px solid {{c.line}}; border-bottom: 1px solid {{c.line}}; margin: 0 -1px -1px 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">{{k.l}}</span>
<span style="font-size: 30px; font-weight: 600; line-height: 1.05; letter-spacing: -0.035em; color: {{k.color}}; font-variant-numeric: tabular-nums">{{k.v}}<span style="font-size: 13px; font-weight: 500; letter-spacing: 0; color: {{c.muted}}">{{k.u}}</span></span>
<span style="font-size: 12px; color: {{c.muted}}">{{k.sub}}</span>
</div>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px">

<section aria-labelledby="rg-grid" style="flex: 999 1 720px; min-width: 0; box-sizing: border-box; padding: 18px 20px 20px; border-radius: 10px; background: {{c.panel}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 14px; animation: vhm-rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; padding-bottom: 12px; border-bottom: 1px solid {{c.ink}}">
<h2 id="rg-grid" style="margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; color: {{c.accentText}}">A</span>Mặt đứng theo tầng</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">{{gridNote}}</span>
</div>
<div style="overflow-x: auto; padding: 3px">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 640px">
<template data-for="floors" data-as="f">
<div style="display: grid; grid-template-columns: 30px repeat(36, minmax(0, 1fr)); gap: 3px; align-items: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: {{c.muted}}; font-variant-numeric: tabular-nums">T{{f.n}}</span>
<template data-if="f.hasPad"><span style="grid-column: span {{f.pad}}"></span></template>
<template data-for="f.cells" data-as="x"><button type="button" title="{{x.aria}}" aria-label="{{x.aria}}" onClick="{{x.pick}}" style="height: 20px; min-width: 0; padding: 0; border: 0; border-radius: 2px; background: {{x.bg}}; opacity: {{x.op}}; box-shadow: {{x.ring}}; cursor: pointer"></button></template>
</div>
</template>
<div style="display: grid; grid-template-columns: 30px repeat(36, minmax(0, 1fr)); gap: 3px; padding-top: 6px">
<span></span>
<span style="grid-column: span 36; height: 10px; background: repeating-linear-gradient(90deg, {{c.ink}} 0 1px, transparent 1px 2.7778%); opacity: 0.4"></span>
</div>
</div>
</div>
<template data-if="isStatus">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px">
<template data-for="legend" data-as="lg"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 10px; border-radius: 2px; background: {{lg.bg}}"></span>{{lg.label}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{c.muted}}; font-variant-numeric: tabular-nums">{{lg.n}}</span></span></template>
</div>
</template>
<template data-if="isTemp">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">22°C</span>
<span style="width: 220px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, #2B6F9E, #7FB3C8 22%, #E9E3CA 40%, #F2B544 60%, #E2563A 82%, #A82818)"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">32°C</span>
<span style="color: {{c.muted}}">. Vùng kem là dễ chịu (24–26°C). Ngoài trời {{outdoor}}</span>
</div>
</template>
</section>

<aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-labelledby="rg-room" style="box-sizing: border-box; padding: 18px 20px 20px; border-radius: 10px; background: {{c.panel}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 12px; animation: vhm-rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.08s both">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid {{c.ink}}">
<h2 id="rg-room" style="margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; color: {{c.accentText}}">B</span>{{rv.title}}</h2>
<template data-if="rv.on"><span style="padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; background: {{rv.sbg}}; color: {{rv.sfg}}">{{rv.slabel}}</span></template>
</div>
<template data-if="rv.off"><p style="margin: 0; font-size: 13px; color: {{c.muted}}">Bấm một ô trên lưới hoặc một dòng trong bảng bên dưới để xem chi tiết phòng.</p></template>
<template data-if="rv.on">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Nhiệt độ</span><span style="font-size: 24px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{rv.temp}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Ở trạng thái này</span><span style="font-size: 24px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{rv.dur}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Loại phòng</span><span style="font-size: 13.5px">{{rv.label}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Khách</span><span style="font-size: 13.5px">{{rv.guests}}</span></div>
<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Đang ở đâu</span><span style="font-size: 13.5px; font-weight: 600">{{rv.where}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">Trạng thái trong ngày</span>
<div style="position: relative; height: 14px">
<div style="display: flex; height: 14px; border-radius: 2px; overflow: hidden"><template data-for="rv.strip" data-as="g"><span style="height: 14px; flex: 1; background: {{g.c}}"></span></template></div>

<span style="font-size: 12.5px; color: {{c.muted}}; font-variant-numeric: tabular-nums">{{hRatio}} × trung bình ngày. {{hCo2}} kg CO2e</span>

<script>
(async function () {
if (location.hash === '#map') {     // old links: go straight to the map page
  location.replace(`map/${(new URLSearchParams(location.search).get('s') || 'baseline').replace(/_/g, '-')}.html`); return;
}

// ------------------------------------------------------------------ template engine for the design pages
// The page markup is the design's own (sc-for / sc-if / {{holes}}); it is rendered here and patched into the DOM.
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, ONE = /^\{\{\s*([^}]+?)\s*\}\}$/;
const TPL = {};
function tpl(name) {
  if (!TPL[name]) { const t = document.createElement('template'); t.innerHTML = document.getElementById('tpl-' + name).textContent; TPL[name] = t.content; }
  return TPL[name];
}
function look(path, scope) { const p = path.split('.'); let v = scope[p[0]]; for (let i = 1; i < p.length && v != null; i++) v = v[p[i]]; return v; }
const fill = (s, scope) => s.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
const kidsOf = (n) => (n.content ? n.content.childNodes : n.childNodes);
function build(nodes, scope, out) {
  for (const n of nodes) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.nodeValue.indexOf('{{') < 0 ? n.nodeValue : fill(n.nodeValue, scope))); continue; }
    if (n.nodeType !== 1) continue;
    if (n.hasAttribute('data-for')) {
      const list = look(n.getAttribute('data-for'), scope) || [], as = n.getAttribute('data-as');
      for (const item of list) { const sc = Object.create(scope); sc[as] = item; build(kidsOf(n), sc, out); }
      continue;
    }
    if (n.hasAttribute('data-if')) { if (look(n.getAttribute('data-if'), scope)) build(kidsOf(n), scope, out); continue; }
    const el = n.cloneNode(false);
    for (const a of [...n.attributes]) {
      const name = a.name, v = a.value;
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      if (name.startsWith('on')) { el.removeAttribute(name); const m = ONE.exec(v); const fn = m && look(m[1], scope); if (typeof fn === 'function') (el.__on = el.__on || {})[name.slice(2)] = fn; continue; }
      if (v.indexOf('{{') < 0) continue;
      const m = ONE.exec(v);
      if (m) { const x = look(m[1], scope); if (x === false || x == null) el.removeAttribute(name); else el.setAttribute(name, x === true ? '' : String(x)); }
      else el.setAttribute(name, fill(v, scope));
    }
    build(kidsOf(n), scope, el); out.appendChild(el);
  }
}
function morph(a, b) {
  if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.hasAttribute('data-lang-slot')) return;   // the language switch fills this itself
  for (const { name, value } of b.attributes) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  for (const { name } of [...a.attributes]) if (!b.hasAttribute(name)) a.removeAttribute(name);
  a.__on = b.__on;
  morphKids(a, b);
}
function morphKids(a, b) {
  const an = a.childNodes, bn = [...b.childNodes];
  for (let i = 0; i < bn.length; i++) {
    const x = an[i], y = bn[i];
    if (x && x.nodeType === y.nodeType && x.nodeName === y.nodeName) morph(x, y); else if (x) a.replaceChild(y, x); else a.appendChild(y);
  }
  while (an.length > bn.length) a.removeChild(a.lastChild);
}
const root = document.getElementById('app');
['click', 'input', 'change', 'mousemove'].forEach((type) => root.addEventListener(type, (e) => {
  const key = type === 'input' ? 'change' : type;
  for (let el = e.target; el && el !== root; el = el.parentNode) {
    if (el.__on && el.__on[key]) { el.__on[key]({ target: e.target, currentTarget: el, clientX: e.clientX, clientY: e.clientY, preventDefault: () => e.preventDefault() }); return; }
  }
}));

// ------------------------------------------------------------------ shared helpers
const fmt = (n, d) => { if (n == null || Number.isNaN(n)) return '–'; const p = Number(n).toFixed(d || 0).split('.'); return p[0].replace('-', '−').replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : ''); };
const sgn = (n, d) => (n > 0 ? '+' : '') + fmt(n, d);
const hm = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const durTxt = (m) => (m >= 60 ? Math.floor(m / 60) + ' g ' : '') + String(m % 60).padStart(m >= 60 ? 2 : 1, '0') + ' ph';
const deg = (v) => v.toFixed(1).replace('.', ',') + '°C';
const mean = (a) => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
const PALETTE = {
  light: { bg: '#F4F0DB', panel: '#FBF8EB', panel2: '#E9E3CA', line: '#D6CEAE', ink: '#2E3A26', muted: '#65705A', accentText: '#C2401E', primaryBg: '#2E3A26', primaryFg: '#F4F0DB',
    night: 'rgba(46,58,38,0.05)', good: '#1F5F8E', bad: '#C2401E', okT: '#2F7A4A', warnT: '#8A5A00', blueT: '#1F5F8E' },
  dark: { bg: '#12160F', panel: '#1D2318', panel2: '#2A3223', line: '#343D2C', ink: '#F4F0DB', muted: '#A8AD97', accentText: '#FF8A66', primaryBg: '#F4F0DB', primaryFg: '#2E3A26',
    night: 'rgba(244,240,219,0.04)', good: '#7FB3E0', bad: '#FF8A66', okT: '#8FCB9F', warnT: '#F2B544', blueT: '#7FB3E0' },
};
const ROOM_ST = {
  awake: { bg: '#F2B544', fg: '#1B2418', label: 'Có khách, thức' },
  sleep: { bg: '#6B60C8', fg: '#FFFFFF', label: 'Có khách, ngủ' },
  hot: { bg: '#E2563A', fg: '#1B2418', label: 'Có khách, quá nóng' },
  acon: { bg: '#22A9CB', fg: '#1B2418', label: 'Vắng, điều hòa chạy' },
  acoff: { bg: '#86A2B5', fg: '#1B2418', label: 'Vắng, điều hòa tắt' },
  clean: { bg: '#45A86F', fg: '#1B2418', label: 'Đang dọn' },
  vacant: { bg: '#4A5B6E', fg: '#FFFFFF', label: 'Phòng trống' },
};
const CODE7 = { '0': 'vacant', '1': 'acoff', '2': 'acon', '3': 'awake', '4': 'sleep', '5': 'clean', '6': 'hot' };
const CAT_VI = { solo: 'Một mình', couple: 'Cặp đôi', family: 'Gia đình', friends: 'Nhóm bạn' };
const PARK = new Set(['THRILL', 'FAMILY', 'INDOOR', 'WATER', 'SHOW', 'PARK_RESTAURANT', 'REST_A', 'REST_B']);
const FOOD = new Set(['HOTEL_RESTAURANT', 'PARK_RESTAURANT', 'M_CAFE']);
const ZONE_VI = { INDOOR: 'Mái Vòm Đại Dương', WATER: 'Vịnh Sóng Xanh', REST_A: 'Vườn Kính', REST_B: 'Vườn Cọ', THRILL: 'Đỉnh Phiêu Lưu', FAMILY: 'Khu trò chơi gia đình',
  SHOW: 'Sân khấu', PARK_RESTAURANT: 'Phố ẩm thực', HOTEL_RESTAURANT: 'Nhà hàng khách sạn', POOL: 'Hồ bơi', CITY: 'Dạo phố trong thành phố' };

// ------------------------------------------------------------------ app state, data, routing, theme, scenario menu
const ST = await getJSON('data/static.json');
const app = { scenario: 'baseline', tab: 'rooms', data: {}, dec: {}, pages: {}, dark: document.documentElement.dataset.theme === 'dark', pending: false };
try { const q = new URLSearchParams(location.search).get('s'); if (q && ST.scenarios.some((s) => s.key === q)) app.scenario = q; } catch (e) {}
const TABS = ['rooms', 'groups', 'energy', 'queues', 'compare', 'data'];
const TITLE = { rooms: 'Lưới phòng', groups: 'Nhóm khách', energy: 'Điện & phát thải', queues: 'Hàng chờ', compare: 'So sánh kịch bản', data: 'Dữ liệu' };
const readTab = () => { const h = location.hash.slice(1); return TABS.includes(h) ? h : 'rooms'; };
app.tab = readTab();
const scen = () => ST.scenarios.find((s) => s.key === app.scenario);
const scenShort = () => scen().label.replace(/ \(.*\)$/, '');
async function load(key) { if (!app.data[key]) app.data[key] = await getJSON(`data/${ST.scenarios.find((s) => s.key === key).slug}.json`); return app.data[key]; }
function render() { if (app.pending) return; app.pending = true; requestAnimationFrame(doRender); }
function doRender() {
  app.pending = false;
  const page = app.pages[app.tab]; const D = app.data[app.scenario]; if (!page || !D) return;
  const c = PALETTE[app.dark ? 'dark' : 'light'];
  const base = {
    c, accent: '#F15534', dark: app.dark, light: !app.dark, darkPressed: String(app.dark), toggleTheme: toggleTheme,
    nav: { map: `map/${scen().slug}.html` }, scenName: scenShort(), openScen, dataTag: 'Kết quả mô phỏng',
  };
  const vals = Object.assign(base, page.vals(D, c));
  const frag = document.createDocumentFragment();
  build(tpl(app.tab).childNodes, vals, frag);
  morphKids(root, frag);
  root.querySelectorAll('input[value], select[value]').forEach((e) => { const v = e.getAttribute('value'); if (e.value !== v) e.value = v; });
  document.body.style.background = c.bg;
  document.title = TITLE[app.tab] + ' – ABM';
}
function toggleTheme() { app.dark = !app.dark; document.documentElement.dataset.theme = app.dark ? 'dark' : 'light'; try { localStorage.setItem('vhm-theme', app.dark ? 'dark' : 'light'); } catch (e) {} render(); }
window.addEventListener('storage', (e) => { if (e.key === 'vhm-theme' && e.newValue) { app.dark = e.newValue === 'dark'; render(); } });
const menu = document.getElementById('scenMenu');

    lang = LANGS.includes(q) ? q : LANGS.includes(s) ? s : 'vi';
  } catch (e) { /* storage blocked: stay in Vietnamese */ }

  // number templates: "Khối phòng (533)" also matches "Khối phòng (426)"
  const TPL = new Map();
  for (const k in DICT) {
    const kn = k.match(NUM); if (!kn) continue;
    const tk = k.replace(NUM, HOLE); if (TPL.has(tk)) continue;
    const v = DICT[k].map((s) => ((s.match(NUM) || []).length === kn.length ? s.replace(NUM, HOLE) : null));
    if (v.every((x) => x != null)) TPL.set(tk, v);
  }
  // phrase fallback for text the code assembles from pieces: at each position the longest known phrase wins,
  // whole words only. Plain loops and no lookbehind or \p{} regex, so older TV browsers run it too.
  const isL = (c) => /[0-9A-Za-z\u00C0-\u024F\u1E00-\u1EFF\u0400-\u04FF]/.test(c || '');
  const FIRST = {};
  Object.keys(DICT).filter((k) => k.length > 1).sort((a, b) => b.length - a.length)
    .forEach((k) => { (FIRST[k[0]] || (FIRST[k[0]] = [])).push(k); });
  function phrases(s, col) {
    let out = '', i = 0;
    while (i < s.length) {
      const list = FIRST[s[i]]; let hit = null;
      if (list && !(isL(s[i]) && isL(s[i - 1]))) {
        for (let j = 0; j < list.length; j++) {
          const k = list[j], e = i + k.length;
          if (s.startsWith(k, i) && !(isL(k[k.length - 1]) && isL(s[e]))) { hit = k; break; }
        }
      }
      if (hit) { out += DICT[hit][col]; i += hit.length; } else { out += s[i]; i += 1; }
    }
    return out;
  }

  // the pages write numbers the Vietnamese way (1.830 and 20,0): English gets 1,830 and 20.0, Russian 1 830 and 20,0
  // (a plain no-break space: TV fonts often lack the narrow one)
  const VNUM = /(^|[^\d.,])(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+,\d+)(?!\d|[.,]\d)/g;
  const numFix = (s) => s.replace(VNUM, (x, pre, n) => pre +
    (lang === 'en' ? n.replace(/[.,]/g, (c) => (c === '.' ? ',' : '.')) : n.replace(/\./g, '\u00A0')));

  const cache = new Map();
  function tr(s) {
    if (lang === 'vi') return s;
    const hit = cache.get(s); if (hit !== undefined) return hit;
    const out = numFix(/[A-Za-z\u00C0-\u024F\u1E00-\u1EFF]/.test(s) ? words(s) : s);
    if (cache.size > 20000) cache.clear();
    cache.set(s, out);
    return out;
  }
  function words(s) {
    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s), core = m[2], col = COL[lang];
    let out = DICT[core] ? DICT[core][col] : null;
    if (out == null) {
      const nums = core.match(NUM), t = nums && TPL.get(core.replace(NUM, HOLE));
      if (t) { let j = 0; out = t[col].replace(/\u0001/g, () => nums[j++]); }
    }
    if (out == null) out = phrases(core, col);
    return m[1] + out + m[3];
  }

  // per text node / attribute: the Vietnamese source and what we last wrote
  const textSrc = new WeakMap(), attrSrc = new WeakMap();
  let changed = false;
  function doText(n) {
    const cur = n.nodeValue, rec = textSrc.get(n);
    const src = rec && cur === rec.out ? rec.src : cur;
    const out = tr(src);
    if (out !== src || rec) textSrc.set(n, { src, out });
    if (out !== cur) { n.nodeValue = out; changed = true; }
  }
  function doAttr(el, a) {
    const cur = el.getAttribute(a); if (cur == null) return;
    let recs = attrSrc.get(el); const rec = recs && recs[a];
    const src = rec && cur === rec.out ? rec.src : cur;
    const out = tr(src);
    if (out !== src || rec) { if (!recs) attrSrc.set(el, (recs = {})); recs[a] = { src, out }; }
    if (out !== cur) { el.setAttribute(a, out); changed = true; }
  }
  function walk(root) {
    if (root.nodeType === 3) { if (!root.parentNode || !SKIP[root.parentNode.nodeName]) doText(root); return; }
    if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
    if (root.hasAttribute('data-lang-slot')) { fillSlot(root); return; }
    for (const a of ATTRS) if (root.hasAttribute(a)) doAttr(root, a);
    for (let c = root.firstChild; c; c = c.nextSibling) walk(c);
  }

  // the switch itself: filled into every [data-lang-slot]; pages keep that element out of their own re-renders
  const NAMES = { vi: 'Tiếng Việt', en: 'English', ru: 'Русский' };
  function fillSlot(slot) {
    if (!slot.firstChild) {
      slot.className = 'lang-switch'; slot.setAttribute('role', 'group'); slot.setAttribute('aria-label', 'Ngôn ngữ / Language / Язык');
      slot.innerHTML = LANGS.map((l) => `<button type="button" data-lang="${l}" lang="${l}" title="${NAMES[l]}">${l.toUpperCase()}</button>`).join('');
      slot.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });
    }
    slot.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }
  const css = document.createElement('style');
  css.textContent = '.lang-switch{display:inline-flex;flex:none;align-items:stretch;height:44px;border:1px solid currentColor;border-radius:8px;overflow:hidden}' +
    '.lang-switch button{min-width:38px;padding:0 8px;border:0;background:transparent;color:inherit;font:600 11.5px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;cursor:pointer;opacity:.6}' +
    '.lang-switch button+button{border-left:1px solid currentColor}' +
    '.lang-switch button[aria-pressed="true"]{opacity:1;background:var(--lang-ink,#2E3A26);color:var(--lang-on,#F4F0DB)}' +
    '.lang-switch button:hover{opacity:1}';
  document.head.appendChild(css);

  let busy = false;
  function run(fn) {
    busy = true; changed = false;
    try { fn(); } finally { busy = false; }
    if (changed) document.dispatchEvent(new CustomEvent('i18n:changed', { detail: { lang } }));
  }
  function setLang(l) {
    if (!LANGS.includes(l) || l === lang) return;
    lang = l; cache.clear();
    try { localStorage.setItem(KEY, l); } catch (e) { /* not remembered */ }
    document.documentElement.lang = l;
    run(() => walk(document.documentElement));
    document.querySelectorAll('[data-lang-slot]').forEach(fillSlot);
  }
  window.vhmLang = { get: () => lang, set: setLang, tr: (s) => tr(s) };

  new MutationObserver((list) => {
    if (busy) return;
    run(() => {
      for (const m of list) {
        if (m.type === 'childList') m.addedNodes.forEach(walk);
        else if (m.type === 'characterData') { if (m.target.parentNode && !SKIP[m.target.parentNode.nodeName]) doText(m.target); }
        else if (m.target.nodeType === 1) doAttr(m.target, m.attributeName);
      }
    });
  }).observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  const start = () => { document.documentElement.lang = lang; run(() => walk(document.documentElement)); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
